name: Build checks

on:
    pull_request:
        branches:
            - main

jobs:
    build-go:
        runs-on: windows-latest
        defaults:
            run:
                working-directory: ./backend
        steps:
            - &checkout_step
              uses: actions/checkout@v4
            - &setup_go_step
              uses: actions/setup-go@v4
              with:
                  go-version: 1.21.x
            - name: Build parser
              run: go build parser/parser.go
            - name: Build server
              run: go build server/server.go

    test-go:
        runs-on: windows-latest
        defaults:
            run:
                working-directory: ./backend
        steps:
            - *checkout_step
            - *setup_go_step
            - name: Test server
              run: go test ./server/...

    build-js:
        runs-on: windows-latest
        defaults:
            run:
                working-directory: ./client
        steps:
            - *checkout_step
            - &setup_node_step
              uses: actions/setup-node@v4
              with:
                  node-version: 20.x
                  cache: npm
                  cache-dependency-path: client/package-lock.json
            - &npm_ci_step
              run: npm ci
            - name: Build
              run: npm run build

    test-js:
        runs-on: windows-latest
        defaults:
            run:
                working-directory: ./client
        steps:
            - *checkout_step
            - *setup_node_step
            - *npm_ci_step
            - name: Test
              run: npm run test

